<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History Spark — Wereldkaart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=IM+Fell+English:ital@0;1&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIINfQ3o7Q8fH8fYQ6a5cVQ5qT4q5qT4q5Q=" crossorigin="">
  <style>
    :root { --ink:#332619; --paper:#ead6aa; --paper-dark:#c29b5e; --rust:#783b27; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); font-family:'Libre Baskerville',serif; background:#493523; background-image:radial-gradient(circle,rgba(244,225,179,.25),transparent 65%); }
    header { display:flex; justify-content:space-between; align-items:center; gap:20px; padding:22px 5vw; color:var(--paper); border-bottom:4px double var(--paper-dark); }
    header h1 { margin:0; font:700 clamp(1.4rem,3vw,2.2rem) 'Cinzel',serif; letter-spacing:.08em; }
    header h1 span { color:#d3a05b; }
    .back { color:var(--paper); font-size:.82rem; text-decoration:none; border-bottom:1px solid var(--paper-dark); }
    main { width:min(1400px,94%); margin:30px auto 50px; }
    .intro { margin-bottom:20px; color:var(--paper); }
    .intro h2 { margin:0 0 8px; font:700 clamp(1.7rem,4vw,3rem) 'Cinzel',serif; }
    .intro p { margin:0; font:italic 1rem 'IM Fell English',serif; }
    .map-frame { position:relative; overflow:hidden; padding:clamp(12px,2vw,28px); border:10px double var(--rust); background:var(--paper); box-shadow:0 20px 55px rgba(20,10,4,.4),inset 0 0 35px rgba(120,75,30,.25); }
    .map-frame::before { content:'CARTA MUNDI · ANNO DOMINI'; position:absolute; top:9px; left:50%; transform:translateX(-50%); z-index:2; color:var(--rust); font:700 clamp(.55rem,1.3vw,.8rem) 'Cinzel',serif; white-space:nowrap; }
    #map { height:min(72vh,760px); min-height:460px; margin-top:22px; border:1px solid rgba(51,38,25,.45); background:#a9c8c4; }
    .leaflet-container { font-family:'Libre Baskerville',serif; }
    .country-label { color:#332619; text-shadow:1px 1px 0 #ead6aa,-1px -1px 0 #ead6aa; font-size:10px; font-weight:700; white-space:nowrap; }
    .capital-label { color:#4c1e13; text-shadow:1px 1px 0 #ead6aa,-1px -1px 0 #ead6aa; font-size:10px; font-weight:700; white-space:nowrap; }
    .capital-marker { width:10px!important; height:10px!important; margin-left:-5px!important; margin-top:-5px!important; border:2px solid #fff; border-radius:50%; background:#8b2d1d; box-shadow:0 1px 4px #332619; }
    .legend { display:flex; flex-wrap:wrap; justify-content:center; gap:18px; padding:15px 5px 2px; color:#49321f; font-size:.78rem; }
    .legend span::before { content:''; display:inline-block; width:12px; height:12px; margin-right:6px; vertical-align:-2px; border-radius:50%; background:#8b2d1d; border:2px solid #fff; box-shadow:0 0 0 1px #8b2d1d; }
    .legend span:first-child::before { border-radius:2px; background:#b7874e; border:0; box-shadow:0 0 0 1px #704b2b; }
    #status { margin:10px 0 0; text-align:center; color:#6d4323; font-size:.78rem; }
    .popup-title { margin:0 0 5px; color:var(--rust); font:700 1.05rem 'Cinzel',serif; }
    @media (max-width:600px) { header { align-items:flex-start; flex-direction:column; } .map-frame { padding:8px; border-width:6px; } #map { min-height:400px; } }
  </style>
</head>
<body>
  <header><h1>History <span>Spark</span></h1><a class="back" href="index.html">← Terug naar het begin</a></header>
  <main>
    <section class="intro"><h2>De wereld door de eeuwen heen</h2><p>Een echte wereldkaart met elk land en zijn hoofdstad. Klik op een land of hoofdstad voor meer informatie.</p></section>
    <section class="map-frame" aria-label="Interactieve wereldkaart met hoofdsteden">
      <div id="map" role="img" aria-label="Interactieve kaart van alle landen en hoofdsteden"></div>
      <p id="status">Wereldkaart en hoofdsteden worden geladen…</p>
      <div class="legend"><span>Land</span><span>Hoofdstad</span></div>
    </section>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const map = L.map('map', { minZoom: 2, worldCopyJump: true }).setView([20, 5], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> bijdragers',
      maxZoom: 7
    }).addTo(map);

    const countryStyle = { color:'#704b2b', weight:1, fillColor:'#b7874e', fillOpacity:.72 };
    const selectedStyle = { color:'#783b27', weight:2, fillColor:'#d3a05b', fillOpacity:.9 };
    const capitalLayer = L.layerGroup().addTo(map);
    let countriesByCode = {};

    function countryName(feature) {
      return feature.properties.ADMIN || feature.properties.name || feature.properties.NAME || 'Onbekend land';
    }

    function showCountry(feature, layer) {
      const code = feature.properties.ISO_A3 || feature.properties.ADM0_A3 || feature.properties.iso_a3;
      const country = countriesByCode[code];
      const name = countryName(feature);
      const capital = country && country.capital ? country.capital[0] : 'Geen officiële hoofdstad gevonden';
      layer.bindPopup('<h3 class="popup-title">' + name + '</h3><strong>Hoofdstad:</strong> ' + capital);
      layer.bindTooltip(name, { className:'country-label', sticky:true, direction:'center', opacity:.9 });
      layer.on({ mouseover:e => e.target.setStyle(selectedStyle), mouseout:e => e.target.setStyle(countryStyle) });
    }

    async function loadMapData() {
      const [geoResponse, capitalsResponse] = await Promise.all([
        fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson'),
        fetch('https://restcountries.com/v3.1/all?fields=name,capital,capitalInfo,cca3')
      ]);
      if (!geoResponse.ok || !capitalsResponse.ok) throw new Error('De kaartgegevens konden niet worden opgehaald.');
      const geojson = await geoResponse.json();
      const capitals = await capitalsResponse.json();
      capitals.forEach(country => { if (country.cca3) countriesByCode[country.cca3] = country; });

      L.geoJSON(geojson, { style:countryStyle, onEachFeature:showCountry }).addTo(map);
      capitals.forEach(country => {
        const coordinates = country.capitalInfo && country.capitalInfo.latlng;
        if (!coordinates || coordinates.length < 2 || !country.capital) return;
        const capital = country.capital[0];
        const name = country.name && (country.name.common || country.name.official) || 'Onbekend land';
        const marker = L.marker([coordinates[0], coordinates[1]], { icon:L.divIcon({ className:'capital-marker', html:'' }) }).addTo(capitalLayer);
        marker.bindPopup('<h3 class="popup-title">' + capital + '</h3><strong>Hoofdstad van:</strong> ' + name);
        marker.bindTooltip(capital, { className:'capital-label', direction:'right', offset:[7,0] });
      });
      document.getElementById('status').textContent = capitals.length + ' landen geladen. Rode punten zijn hoofdsteden.';
    }

    loadMapData().catch(error => {
      document.getElementById('status').textContent = 'De kaart kon niet worden geladen. Controleer je internetverbinding en probeer opnieuw.';
      console.error(error);
    });
  </script>
</body>
</html>
