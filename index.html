<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History Spark</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --nacht: #10152f;
      --paars: #7757d9;
      --roze: #f16bba;
      --goud: #ffd166;
      --wit: #fffaf2;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--wit);
      font-family: 'Montserrat', sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(241, 107, 186, .25), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(119, 87, 217, .3), transparent 35%),
        var(--nacht);
    }

    .hero {
      position: relative;
      width: min(90%, 900px);
      padding: 90px 30px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 28px;
      background: rgba(255, 255, 255, .08);
      box-shadow: 0 25px 80px rgba(0, 0, 0, .35);
      backdrop-filter: blur(12px);
    }

    .spark {
      display: block;
      margin-bottom: 18px;
      color: var(--goud);
      font-size: 2rem;
      letter-spacing: .5em;
      animation: twinkle 2s ease-in-out infinite alternate;
    }

    h1 {
      margin: 0;
      font-family: 'Cinzel', serif;
      font-size: clamp(3.2rem, 10vw, 7.5rem);
      line-height: 1.05;
      letter-spacing: .04em;
      text-shadow: 0 8px 25px rgba(0, 0, 0, .3);
    }

    h1 span:first-child { color: var(--roze); }
    h1 span:last-child { color: var(--goud); }

    p {
      margin: 28px auto 0;
      max-width: 600px;
      color: rgba(255, 250, 242, .82);
      font-size: clamp(1rem, 2vw, 1.2rem);
      line-height: 1.7;
    }

    .button {
      display: inline-block;
      margin-top: 34px;
      padding: 14px 28px;
      color: var(--nacht);
      font-weight: 600;
      text-decoration: none;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--goud), var(--roze));
      transition: transform .25s ease, box-shadow .25s ease;
    }

    .button:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 25px rgba(241, 107, 186, .3);
    }

    @keyframes twinkle {
      from { opacity: .55; transform: scale(.95); }
      to { opacity: 1; transform: scale(1.05); }
    }
  </style>
</head>
<body>
  <main class="hero">
    <span class="spark">✦ ✧ ✦</span>
    <h1><span>History</span> <span>Spark</span></h1>
    <p>Ontdek de verhalen, mensen en momenten die onze geschiedenis hebben laten schitteren.</p>
    <a class="button" href="#ontdek">Ontdek meer</a>
  </main>
</body>
</html>
