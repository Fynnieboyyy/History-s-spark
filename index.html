<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History Spark — Het Historisch Archief</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=IM+Fell+English:ital@0;1&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #30251b;
      --paper: #e7d2a7;
      --paper-light: #f4e7c6;
      --rust: #873f29;
      --gold: #b8893e;
      --shadow: rgba(48, 37, 27, .35);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: var(--ink);
      font-family: 'Libre Baskerville', Georgia, serif;
      background: #493523;
      background-image: radial-gradient(ellipse at center, rgba(246, 226, 177, .25), transparent 65%), repeating-linear-gradient(0deg, rgba(48, 37, 27, .08) 0 1px, transparent 1px 4px);
    }

    .hero {
      position: relative;
      width: min(92%, 900px);
      padding: clamp(48px, 9vw, 96px) clamp(24px, 7vw, 70px);
      text-align: center;
      border: 10px double var(--rust);
      outline: 1px solid var(--gold);
      outline-offset: -20px;
      background: linear-gradient(rgba(244, 231, 198, .94), rgba(215, 187, 133, .94)), repeating-linear-gradient(25deg, transparent 0 5px, rgba(135, 63, 41, .08) 6px 7px);
      box-shadow: 0 24px 60px var(--shadow), inset 0 0 60px rgba(94, 53, 22, .25);
    }

    .seal { color: var(--rust); font-size: 2.4rem; letter-spacing: .3em; }
    .date { margin: 12px 0 24px; color: var(--rust); font: 700 .75rem 'Cinzel', serif; letter-spacing: .28em; text-transform: uppercase; }
    h1 { margin: 0; font: 800 clamp(3rem, 10vw, 7rem)/.95 'Cinzel', serif; letter-spacing: .04em; text-shadow: 2px 2px 0 rgba(184, 137, 62, .35); }
    h1 span:first-child { color: var(--rust); }
    h1 span:last-child { display: block; color: var(--ink); }
    .rule { display: flex; align-items: center; gap: 14px; margin: 28px auto 0; max-width: 520px; color: var(--gold); }
    .rule::before, .rule::after { content: ''; height: 1px; flex: 1; background: var(--gold); }
    p { max-width: 590px; margin: 24px auto 0; font: italic clamp(1rem, 2vw, 1.2rem)/1.8 'IM Fell English', Georgia, serif; }
    .button { display: inline-block; margin-top: 34px; padding: 15px 34px; color: var(--paper-light); font: 700 .9rem 'Cinzel', serif; letter-spacing: .08em; text-decoration: none; text-transform: uppercase; border: 2px solid var(--ink); border-radius: 3px; background: var(--rust); box-shadow: 4px 4px 0 var(--gold); transition: transform .2s, box-shadow .2s; }
    .button:hover { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--gold); }
    .corner { position: absolute; color: var(--rust); font-size: 1.4rem; }
    .top-left { top: 18px; left: 25px; } .top-right { top: 18px; right: 25px; } .bottom-left { bottom: 18px; left: 25px; } .bottom-right { bottom: 18px; right: 25px; }
  </style>
</head>
<body>
  <main class="hero">
    <span class="corner top-left">❧</span><span class="corner top-right">❧</span>
    <div class="seal">✦ ❖ ✦</div>
    <div class="date">Een atlas van vervlogen tijden</div>
    <h1><span>History</span><span>Spark</span></h1>
    <div class="rule">✦</div>
    <p>Ontdek de verhalen, mensen en momenten die onze geschiedenis hebben laten schitteren.</p>
    <a class="button" href="game.html">Doorgaan naar de kaart</a>
    <span class="corner bottom-left">❧</span><span class="corner bottom-right">❧</span>
  </main>
</body>
</html>
